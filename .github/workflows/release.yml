name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Archives carry the whole publish output, not just the binary:
      # MSBuildWorkspace ships out-of-proc BuildHost folders next to the exe,
      # required for semantic indexing (single-file bundle does not embed them).
      - name: Publish linux-x64
        run: |
          dotnet publish src/Squeezr.Cli/Squeezr.Cli.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:DebugSymbols=false -o dist/squeezr-linux-x64
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "squeezr-$version-linux-x64.tar.gz" -C dist squeezr-linux-x64
          ls -lh squeezr-*
      # Release via the native Gitea API: third-party release actions are
      # a runtime lottery here (softprops 405s, the gitea fork needs go).
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${GITHUB_TOKEN}"

          code=$(curl -s -o /tmp/rel.json -w '%{http_code}' -H "$auth" "$api/releases/tags/$tag")
          if [ "$code" = "200" ]; then
            id=$(grep -o '"id":[0-9]*' /tmp/rel.json | head -n1 | cut -d: -f2)
            echo "reusing release id $id"
          else
            resp=$(curl -sf -X POST "$api/releases" -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":\"See CHANGELOG.md in the repository.\"}")
            id=$(printf '%s' "$resp" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
            echo "created release id $id"
          fi

          for f in squeezr-*-linux-x64.tar.gz; do
            curl -sf -H 'Expect:' -X POST "$api/releases/$id/assets?name=$(basename "$f")" \
              -H "$auth" \
              -F "attachment=@$f"
            echo "uploaded: $f"
          done
